<div class="auth-page">
  <a routerLink="/" class="back-link">&larr; Back to home</a>

  <div class="auth-page__illustration">
    <div class="illustration-content" [innerHTML]="illustration"></div>
    <p class="illustration-tagline">Sri Lanka's print job marketplace</p>
    <p class="illustration-subtext">Describe your job once. Let local print shops compete for it.</p>
  </div>

  <div class="auth-page__form-panel">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()">
      <h1>Log in</h1>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">Enter a valid email address.</span>
        }
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">Password is required.</span>
        }
      </label>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="button button--primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Logging in...' : 'Log in' }}
      </button>

      <p class="auth-switch">
        Don't have an account? <a routerLink="/register">Register</a>
      </p>
    </form>
  </div>
</div>
